name: KORDEN Quality Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korden-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit, API, recovery / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          KORDEN_DATA_DIR: ${{ runner.temp }}/korden-test-data
      - run: python -m compileall -q korden
      - run: node --check static/app.js
      - name: Verify brand cleanup
        run: |
          old_name=$(printf '%s%s' 'FOR' 'GE')
          if git grep -ni -e "$old_name" -e "$(printf '%s' "$old_name" | tr '[:upper:]' '[:lower:]')" -- .; then
            echo 'Legacy product name found.'; exit 1
          fi

  windows-smoke:
    name: Windows runtime compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          KORDEN_DATA_DIR: ${{ runner.temp }}/korden-test-data
      - run: python -m compileall -q korden

  strong-baseline-lab:
    name: Four-policy benchmark audit
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python benchmark_lab.py --count 15 --jobs 5 --time-limit 3 --start-seed 100 --out artifacts/lab
      - uses: actions/upload-artifact@v4
        with:
          name: korden-four-policy-benchmark
          path: artifacts/lab.*

  cross-industry-workloads:
    name: Cross-industry capability and scheduling audit
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python universal_benchmark.py --limit 6 --out artifacts/cross_industry
      - run: python universal_benchmark.py --dataset-dir samples/archives/v06 --limit 6 --out artifacts/archive_v06
      - name: Verify all independent scheduling results
        run: |
          python - <<'PYCODE'
          import json
          data=json.load(open('artifacts/cross_industry.json'))
          assert len(data)==3
          assert {r['industry'] for r in data}=={'Discrete manufacturing','Field service','Warehouse operations'}
          assert all(r['feasible_schedule'] and r['optimized_weighted_tardiness'] is not None for r in data)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: korden-cross-industry-audit
          path: |
            artifacts/cross_industry.*
            artifacts/archive_v06.*

  external-reference-benchmark:
    name: FT06 published optimum regression
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python public_benchmark.py --instance ft06 --time-limit 5 --out artifacts/ft06.json
      - name: Verify result and provenance
        run: |
          python - <<'PYCODE'
          import json
          a=json.load(open('artifacts/ft06.json'))
          assert a['solver_makespan']==55 and a['proven_optimality_matches_reference']
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: korden-external-ft06
          path: artifacts/ft06.json

  disruption-replay:
    name: Frozen-history disruption regression
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python disruption_lab.py --count 10 --time-limit 3 --out artifacts/disruption
      - uses: actions/upload-artifact@v4
        with:
          name: korden-rolling-reschedule-replay
          path: artifacts/disruption.*

  reproducible-benchmark:
    name: Reproducible scheduling benchmark
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python benchmark_suite.py --count 10 --jobs 5 --time-limit 4 --out artifacts/ci_suite
      - uses: actions/upload-artifact@v4
        with:
          name: korden-ci-benchmark
          path: artifacts/ci_suite.*

  container-smoke:
    name: Docker build and health probe
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t korden-ci .
      - run: docker run -d --name korden-smoke -p 127.0.0.1:8000:8000 korden-ci
      - name: Health and UI smoke check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q KORDEN
          curl -fsS http://127.0.0.1:8000/ | grep -q KORDEN
          curl -fsS http://127.0.0.1:8000/api/public-benchmarks/ft06 | grep -q JSPLIB
          curl -fsS http://127.0.0.1:8000/api/universal/templates | grep -q 'Field service'
      - if: always()
        run: docker logs korden-smoke || true
