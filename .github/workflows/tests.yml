name: OPTERA Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: optera-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit, API, recovery / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          OPTERA_DATA_DIR: ${{ runner.temp }}/optera-test-data
      - run: python -m compileall -q optera
      - run: node --check static/app.js
      - name: Verify old branding is absent from public views
        run: |
          old_name=$(printf '%s%s' 'KOR' 'DEN')
          if git grep -niE "(^|[^[:alnum:]])${old_name}([^[:alnum:]]|$)" -- README.md static/ .devcontainer/ render.yaml; then
            echo 'Legacy product name found in public UI or setup files.'; exit 1
          fi

  windows-smoke:
    name: Windows runtime compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q
        env:
          OPTERA_DATA_DIR: ${{ runner.temp }}/optera-test-data
      - run: python -m compileall -q optera

  strong-baseline-lab:
    name: Four-policy benchmark audit
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python benchmark_lab.py --count 15 --jobs 5 --time-limit 3 --start-seed 100 --out artifacts/lab
      - uses: actions/upload-artifact@v4
        with:
          name: optera-four-policy-benchmark
          path: artifacts/lab.*

  cross-industry-workloads:
    name: Cross-industry capability and scheduling audit
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python universal_benchmark.py --limit 6 --out artifacts/cross_industry
      - run: python universal_benchmark.py --dataset-dir samples/archives/v06 --limit 6 --out artifacts/archive_v06
      - name: Verify all independent scheduling results
        run: |
          python - <<'PYCODE'
          import json
          data=json.load(open('artifacts/cross_industry.json'))
          assert len(data)==3
          assert {r['industry'] for r in data}=={'Discrete manufacturing','Field service','Warehouse operations'}
          assert all(r['feasible_schedule'] and r['optimized_weighted_tardiness'] is not None for r in data)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-cross-industry-audit
          path: |
            artifacts/cross_industry.*
            artifacts/archive_v06.*

  external-reference-benchmark:
    name: FT06 published optimum regression
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python public_benchmark.py --instance ft06 --time-limit 5 --out artifacts/ft06.json
      - name: Verify result and provenance
        run: |
          python - <<'PYCODE'
          import json
          a=json.load(open('artifacts/ft06.json'))
          assert a['solver_makespan']==55 and a['proven_optimality_matches_reference']
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-external-ft06
          path: artifacts/ft06.json

  disruption-replay:
    name: Frozen-history disruption regression
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python disruption_lab.py --count 10 --time-limit 3 --out artifacts/disruption
      - uses: actions/upload-artifact@v4
        with:
          name: optera-rolling-reschedule-replay
          path: artifacts/disruption.*

  reproducible-benchmark:
    name: Reproducible scheduling benchmark
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python benchmark_suite.py --count 10 --jobs 5 --time-limit 4 --out artifacts/ci_suite
      - uses: actions/upload-artifact@v4
        with:
          name: optera-ci-benchmark
          path: artifacts/ci_suite.*

  finite-working-calendar-audit:
    name: Validated finite production shift calendars
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests/test_work_windows.py
      - run: python shift_lab.py --out artifacts/shift_window_evidence.json
      - name: Verify shift-aware baseline and optimization
        run: |
          python - <<'PYCODE'
          import json
          evidence=json.load(open('artifacts/shift_window_evidence.json'))
          assert evidence['shift_aware']
          assert evidence['baseline_feasible']
          assert evidence['optimized_feasible']
          assert evidence['optimized_weighted_tardiness'] <= evidence['baseline_weighted_tardiness']
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-finite-shift-evidence
          path: artifacts/shift_window_evidence.json

  container-smoke:
    name: Docker build and health probe
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t optera-ci .
      - run: docker run -d --name optera-smoke -p 127.0.0.1:8000:8000 optera-ci
      - name: Health and UI smoke check
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health | grep -q OPTERA
          curl -fsS http://127.0.0.1:8000/ | grep -q OPTERA
          curl -fsS http://127.0.0.1:8000/api/public-benchmarks/ft06 | grep -q JSPLIB
          curl -fsS http://127.0.0.1:8000/api/universal/templates | grep -q 'Field service'
      - if: always()
        run: docker logs optera-smoke || true

  hmlv-changeover-audit:
    name: High-mix manufacturing setup and changeover research
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python changeover_lab.py --count 20 --start-seed 20261113 --time-limit 2 --out artifacts/hmlv_changeovers
      - name: Compare generated outcomes to committed evidence
        run: |
          python - <<'PYCODE'
          import json
          expected=json.load(open('docs/benchmarks/hmlv_changeover_v1.json'))
          actual=json.load(open('artifacts/hmlv_changeovers.json'))
          assert actual['metadata']['input_checksum_sha256']==expected['metadata']['input_checksum_sha256']
          assert actual['summary']['count']==20
          assert actual['summary']['proven_optima']==20
          assert actual['summary']['baseline_total']==455
          assert actual['summary']['optimized_total']==327
          assert all(a['optimized_weighted_tardiness']<=a['baseline_weighted_tardiness'] for a in actual['rows'])
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-hmlv-changeover-audit
          path: artifacts/hmlv_changeovers.*

  enterprise-workforce-audit:
    name: Workforce optimization and relational data integrity
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python staffing_lab.py --count 24 --seed-start 1000 --time-limit 2 --out artifacts/staffing
      - run: python planning_workflow.py --data-dir samples/enterprise/field_service --name "CI Service" --industry "Service" --time-unit minute --time-limit 5 --out artifacts/enterprise
      - name: Verify mathematical proof and SQL reconciliations
        run: |
          python - <<'PYCODE'
          import json,sqlite3
          summary=json.load(open('artifacts/staffing.json'))['summary']
          assert summary['fixed_total']==967 and summary['flexible_total']==645
          assert summary['both_optimal']==24 and summary['total_jobs']==144
          con=sqlite3.connect('artifacts/enterprise/planning_analytics.sqlite3')
          rows=con.execute('SELECT plan,weighted_tardiness FROM run_summary ORDER BY plan').fetchall()
          assert rows==[('baseline',16),('optimized',16)],rows
          assert con.execute('PRAGMA integrity_check').fetchone()[0]=='ok'
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-workforce-sql-audit
          path: |
            artifacts/staffing.*
            artifacts/enterprise/*.csv

  mixed-workshop-research:
    name: Mixed-workshop mathematical benchmarking
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python research_lab.py --count-per-profile 2 --stress-count 1 --seed-base 230011 --time-limit 0.7 --out artifacts/mixed_workshops
      - name: Validate per-instance provenance and fallbacks
        run: |
          python - <<'PYCODE'
          import json
          x=json.load(open('artifacts/mixed_workshops.json'))
          assert x['summary']['instances']==7
          assert len(x['rows'])==7
          assert x['metadata']['synthetic'] is True
          assert all(r['recommended_weighted_tardiness']<=r['baseline_weighted_tardiness'] for r in x['rows'])
          assert all(len(r['input_sha256'])==64 for r in x['rows'])
          assert set(x['profile_summaries'])=={'single_cell','two_stage','flexible_cell','congested_cell'}
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-mixed-workshop-evidence
          path: artifacts/mixed_workshops.*

  solver-budget-audit:
    name: Controlled congested-cell time-budget comparison
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python solver_budget_lab.py --count 2 --seed-base 230011 --budgets 0.7,2 --out artifacts/solver_budget_smoke
      - name: Verify seed-pair fairness, schedule protection and honest proof status
        run: |
          python - <<'PYCODE'
          import json
          report = json.load(open('artifacts/solver_budget_smoke.json'))
          rows = report['rows']
          assert len(rows) == 4
          assert {r['seed'] for r in rows} == {230011, 230012}
          assert all(len({r['input_sha256'] for r in rows if r['seed']==seed})==1 for seed in (230011,230012))
          assert all(r['recommended_weighted_tardiness'] <= r['baseline_weighted_tardiness'] for r in rows)
          assert report['metadata']['warm_start'] is False
          assert all(r['time_budget_seconds'] in (0.7,2.0) for r in rows)
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-solver-budget-smoke
          path: artifacts/solver_budget_smoke.*

  hybrid-local-search-audit:
    name: Hybrid scheduling algorithm and proof integrity
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python hybrid_lab.py --count 2 --seed 230011 --limit 0.7 --evaluations 150 --profiles single_cell,two_stage,flexible_cell,congested_cell --out artifacts/hybrid_smoke
      - name: Verify feasible selection, provenance, and no invented proof
        run: |
          python - <<'PYCODE'
          import json
          x=json.load(open('artifacts/hybrid_smoke.json'))
          assert x['metadata']['synthetic'] is True
          assert x['summary']['instances'] == 8
          assert all(len(r['input_sha256'])==64 for r in x['rows'])
          assert all(r['hybrid_weighted_tardiness']<=r['baseline_weighted_tardiness'] for r in x['rows'])
          assert all(r['selected_algorithm'] in ('milp_highs','local_search') for r in x['rows'])
          assert all(r['full_wall_seconds']>=r['local_search_seconds'] for r in x['rows'])
          assert all(isinstance(r['optimality_proven'],bool) for r in x['rows'])
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: optera-hybrid-scheduling-audit
          path: artifacts/hybrid_smoke.*
